<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ordnung</title>
<meta name="description" content="Ordnung for macOS. A music library and record shelf for DJs: files, cues, vinyl and Discogs in one window." />
<meta property="og:title" content="Ordnung" />
<meta property="og:type" content="website" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1024 1024'%3E%3Crect width='1024' height='1024' rx='229' fill='%2342454b'/%3E%3Cpath d='M512 192A320 320 0 1 0 512 832A320 320 0 1 0 512 192ZM512 292A220 220 0 1 1 512 732A220 220 0 1 1 512 292Z' fill='%2393a6bf' fill-rule='evenodd'/%3E%3Crect x='402' y='490' width='220' height='44' rx='22' fill='%2393a6bf'/%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #141414;
    --card: #1b1b1c;
    --line: #2a2a2b;
    --text: #e6e6e6;
    --muted: #8a8a8a;
    --accent: #406eb4;
    --accent-hover: #5a96dc;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

  /* Hero */
  .hero { padding: 96px 0 40px; text-align: center; flex: 1; display: flex; align-items: center; }
  .hero h1 { margin: 0 0 14px; font-size: 3.4rem; font-weight: 650; letter-spacing: -0.035em; line-height: 1.05; }
  .hero p { margin: 0 auto 30px; max-width: 560px; font-size: 1.2rem; color: var(--muted); }
  .cta { display: inline-flex; gap: 18px; align-items: center; }
  .btn {
    padding: 13px 26px;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    text-decoration: none;
    font-size: 1.02rem;
  }
  .btn:hover { background: var(--accent-hover); }
  .gh { color: var(--muted); font-size: 0.95rem; text-decoration: none; }
  .gh:hover { color: var(--text); }
  .fine { margin-top: 14px; font-size: 0.82rem; color: #6a6a6a; }


  @media (max-width: 760px) {
    .hero { padding-top: 64px; }
    .hero h1 { font-size: 2.4rem; }
  }
</style>
</head>
<body>

<section class="hero">
  <div class="wrap">
    <h1>Ordnung</h1>
    <p>A music library and a record shelf for DJs. Your files, your cues, your vinyl and all of Discogs, in one window.</p>
    <div class="cta">
      <a class="btn" href="https://github.com/Kailazy/Ordnung/releases/latest/download/Ordnung-macos-universal.dmg">Download for macOS</a>
      <a class="gh" href="https://github.com/Kailazy/Ordnung">GitHub</a>
    </div>
    <div class="fine">Free and open source. Apple silicon and Intel.</div>
  </div>
</section>

</body>
</html>

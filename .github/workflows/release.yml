name: Release

# Push a version tag (e.g. `git tag v0.0.2 && git push origin v0.0.2`) to build a
# universal macOS DMG and publish it as the rolling `dev` **prerelease**: the dev
# channel. Each build replaces the previous one, so there is only ever one dev
# release. Prereleases never become `releases/latest`, so the website button,
# the README link and the in-app update check keep pointing at the last prod
# release until the dev build is promoted with the Promote workflow
# (`make promote`), which publishes it as its own `vX.Y.Z` release.
# `workflow_dispatch` lets you dry-run a build (artifact only, no Release) by hand.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp (e.g. 0.0.2). No Release is published on manual runs.'
        required: false
        default: '0.0.0'

permissions:
  contents: write   # needed to create the Release and upload the DMG

jobs:
  macos-dmg:
    runs-on: macos-14   # Apple Silicon runner; cross-builds x86_64 too
    steps:
      - uses: actions/checkout@v4

      - name: Add Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install rsvg-convert (icon rendering)
        run: brew install librsvg

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${GITHUB_REF_NAME:-}" ] && [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver="${{ github.event.inputs.version }}"
          fi
          [ -z "$ver" ] && ver="0.0.0"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Building version $ver"

      # One stable self-signed identity for every release: macOS keys the
      # app's privacy grants (Desktop, Documents, removable volumes) to the
      # signature's designated requirement, so the same certificate across
      # versions keeps them through an update. The identity is not trusted
      # by Gatekeeper (that takes Developer ID + notarization); tools/build-app.sh
      # looks it up without requiring trust. Without the secret the build
      # falls back to ad-hoc signing as before.
      - name: Import signing identity
        env:
          P12_B64: ${{ secrets.ORD_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.ORD_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$P12_B64" ]; then echo "no signing secret; ad-hoc build"; exit 0; fi
          kc="$RUNNER_TEMP/signing.keychain-db"
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -p codesigning "$kc"

      - name: Build universal DMG
        env:
          ORDNUNG_SIGN_ID: Ord Release Signing
        run: bash tools/build-app.sh --no-install --no-launch --universal --dmg --dist --version=${{ steps.ver.outputs.version }}

      - name: Show the signature
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/mnt" Ord.dmg >/dev/null
          codesign -dr - "$RUNNER_TEMP/mnt/Ord.app" 2>&1 | grep designated
          hdiutil detach "$RUNNER_TEMP/mnt" >/dev/null

      - name: Name the artifact
        # Two copies of the same DMG: the versioned one, and a fixed name so
        # `releases/latest/download/Ord-macos-universal.dmg` is a stable
        # link the README and website can point at.
        run: |
          mv Ord.dmg "Ord-${{ steps.ver.outputs.version }}-macos-universal.dmg"
          cp "Ord-${{ steps.ver.outputs.version }}-macos-universal.dmg" Ord-macos-universal.dmg

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ord-macos-universal
          path: Ord-*.dmg

      - name: Write release notes
        if: github.ref_type == 'tag'
        run: |
          cat > notes.md <<'NOTES'
          **Universal macOS build** (Apple Silicon + Intel), ad-hoc signed.
          The rekordbox USB export is in beta and not included in this build;
          plugged-in sticks can still be browsed, played and edited in place.

          ### Install
          1. Open the `.dmg` and drag **Ord** into **Applications**.
          2. Double-click Ord. macOS says it can't verify the app: click **Done**.
          3. Open **System Settings → Privacy & Security**, scroll down and click
             **Open Anyway** next to the Ord message. Confirm once more.

          That's a one-time step: the build isn't notarized by Apple, so
          Gatekeeper asks the first time and trusts the app from then on.
          Terminal shortcut: `xattr -dr com.apple.quarantine /Applications/Ord.app`.
          NOTES

      - name: Publish the rolling dev prerelease
        # One `dev` release, replaced on every build, so dev builds don't pile
        # up on the Releases page. Its tag is moved to this commit; the
        # versioned DMG name tells Promote which version it holds.
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          gh release delete dev --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true
          gh release create dev "Ord-$VER-macos-universal.dmg" Ord-macos-universal.dmg \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Ord dev (v$VER)" --notes-file notes.md
